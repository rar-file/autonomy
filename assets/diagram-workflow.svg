<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="300" fill="#0d1117" rx="12"/>
  
  <!-- Title -->
  <text x="350" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#c9d1d9" text-anchor="middle">Autonomy Workflow</text>
  
  <!-- Step 1: Heartbeat -->
  <rect x="30" y="60" width="120" height="80" fill="url(#boxGrad)" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="90" y="90" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="middle">Heartbeat</text>
  <text x="90" y="110" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Every 30 min</text>
  <text x="90" y="128" font-family="-apple-system, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">OpenClaw Native</text>
  
  <!-- Arrow 1 -->
  <line x1="150" y1="100" x2="190" y2="100" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2: AI Decides -->
  <rect x="200" y="60" width="120" height="80" fill="url(#boxGrad)" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="260" y="90" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#a371f7" text-anchor="middle">AI Decides</text>
  <text x="260" y="110" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Check tasks</text>
  <text x="260" y="128" font-family="-apple-system, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">Prioritize work</text>
  
  <!-- Arrow 2 -->
  <line x1="320" y1="100" x2="360" y2="100" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 3: Execute -->
  <rect x="370" y="60" width="120" height="80" fill="url(#boxGrad)" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="430" y="90" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="middle">Execute</text>
  <text x="430" y="110" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Use native tools</text>
  <text x="430" y="128" font-family="-apple-system, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">sessions_spawn</text>
  
  <!-- Arrow 3 -->
  <line x1="430" y1="140" x2="430" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 4: Verify -->
  <rect x="370" y="180" width="120" height="80" fill="url(#boxGrad)" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="430" y="210" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#d29922" text-anchor="middle">Verify</text>
  <text x="430" y="230" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Test & evidence</text>
  <text x="430" y="248" font-family="-apple-system, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">Anti-hallucination</text>
  
  <!-- Arrow 4 -->
  <line x1="370" y1="220" x2="330" y2="220" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 5: Complete -->
  <rect x="200" y="180" width="120" height="80" fill="url(#boxGrad)" stroke="#3fb950" stroke-width="2" rx="8"/>
  <text x="260" y="210" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="middle">Complete</text>
  <text x="260" y="230" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Mark done + proof</text>
  <text x="260" y="248" font-family="-apple-system, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">Update task JSON</text>
  
  <!-- Side panel: Capabilities -->
  <rect x="530" y="60" width="150" height="200" fill="#161b22" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="605" y="85" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" text-anchor="middle">Capabilities</text>
  
  <text x="545" y="110" font-family="-apple-system, sans-serif" font-size="10" fill="#58a6ff">● Task Management</text>
  <text x="545" y="130" font-family="-apple-system, sans-serif" font-size="10" fill="#3fb950">● GitHub Integration</text>
  <text x="545" y="150" font-family="-apple-system, sans-serif" font-size="10" fill="#a371f7">● VM Monitoring</text>
  <text x="545" y="170" font-family="-apple-system, sans-serif" font-size="10" fill="#d29922">● Web Dashboard</text>
  <text x="545" y="190" font-family="-apple-system, sans-serif" font-size="10" fill="#f778ba">● OpenClaw Native</text>
  <text x="545" y="210" font-family="-apple-system, sans-serif" font-size="10" fill="#56d364">● Token Tracking</text>
  
  <!-- Connection to side panel -->
  <line x1="490" y1="100" x2="530" y2="100" stroke="#30363d" stroke-width="1" stroke-dasharray="4 2"/>
</svg>