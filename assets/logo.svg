<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Middle ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="10 5" opacity="0.8"/>
  
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#3fb950" stroke-width="3" opacity="0.6"/>
  
  <!-- Core -->
  <circle cx="100" cy="100" r="30" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="100" cy="100" r="15" fill="#58a6ff" filter="url(#glow)"/>
  
  <!-- Orbital dots -->
  <circle cx="100" cy="10" r="6" fill="#58a6ff">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="100" r="5" fill="#3fb950">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="190" r="4" fill="#58a6ff" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="-360 100 100" dur="25s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection lines -->
  <line x1="100" y1="10" x2="100" y2="190" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
  <line x1="10" y1="100" x2="190" y2="100" stroke="#58a6ff" stroke-width="1" opacity="0.3"/>
</svg>