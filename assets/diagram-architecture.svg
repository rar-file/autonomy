<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" fill="none">
  <rect width="850" height="440" fill="#0d1117" rx="10"/>

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">ClawTonomy — System Architecture</text>

  <!-- External: OpenClaw -->
  <rect x="30" y="60" width="130" height="55" fill="#21262d" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="95" y="82" text-anchor="middle" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">OpenClaw</text>
  <text x="95" y="100" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Heartbeat + Agent</text>
  <line x1="160" y1="87" x2="215" y2="87" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="210,82 220,87 210,92" fill="#58a6ff"/>

  <!-- External: GitHub -->
  <rect x="690" y="60" width="130" height="55" fill="#21262d" stroke="#f78166" stroke-width="2" rx="8"/>
  <text x="755" y="82" text-anchor="middle" fill="#f78166" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">GitHub</text>
  <text x="755" y="100" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Self-update</text>
  <line x1="635" y1="87" x2="690" y2="87" stroke="#f78166" stroke-width="2"/>
  <polygon points="635,82 625,87 635,92" fill="#f78166"/>

  <!-- ====== Core Box ====== -->
  <rect x="220" y="50" width="410" height="230" fill="#161b22" stroke="#30363d" stroke-width="2" rx="10"/>
  <text x="425" y="78" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold">ClawTonomy Core</text>

  <!-- Row 1: CLI + Flask Dashboard -->
  <rect x="240" y="95" width="120" height="45" fill="#238636" rx="6"/>
  <text x="300" y="115" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">clawtonomy CLI</text>
  <text x="300" y="132" text-anchor="middle" fill="#aff5b4" font-family="system-ui, -apple-system, sans-serif" font-size="9">Bash · 30+ cmds</text>

  <rect x="370" y="95" width="120" height="45" fill="#1f6feb" rx="6"/>
  <text x="430" y="115" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Web Dashboard</text>
  <text x="430" y="132" text-anchor="middle" fill="#a5d6ff" font-family="system-ui, -apple-system, sans-serif" font-size="9">Flask · :8767</text>

  <rect x="500" y="95" width="120" height="45" fill="#f78166" rx="6"/>
  <text x="560" y="115" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">36 API Routes</text>
  <text x="560" y="132" text-anchor="middle" fill="#ffdcd7" font-family="system-ui, -apple-system, sans-serif" font-size="9">REST · JSON</text>

  <!-- Row 2: Sync Bridge + Dispatch + Personality -->
  <rect x="240" y="150" width="120" height="45" fill="#8957e5" rx="6"/>
  <text x="300" y="170" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Sync Bridge</text>
  <text x="300" y="187" text-anchor="middle" fill="#d2a8ff" font-family="system-ui, -apple-system, sans-serif" font-size="9">3-file injection</text>

  <rect x="370" y="150" width="120" height="45" fill="#e94560" rx="6"/>
  <text x="430" y="170" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">AI Dispatch</text>
  <text x="430" y="187" text-anchor="middle" fill="#ffdcd7" font-family="system-ui, -apple-system, sans-serif" font-size="9">agent + cron</text>

  <rect x="500" y="150" width="120" height="45" fill="#3fb950" rx="6"/>
  <text x="560" y="170" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Personality</text>
  <text x="560" y="187" text-anchor="middle" fill="#aff5b4" font-family="system-ui, -apple-system, sans-serif" font-size="9">A/B · Version ctrl</text>

  <!-- Row 3: config + NL Parser + Task Templates -->
  <rect x="240" y="205" width="120" height="45" fill="#21262d" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="300" y="225" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12">config.json</text>
  <text x="300" y="240" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="9">v3.5.0</text>

  <rect x="370" y="205" width="120" height="45" fill="#21262d" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="430" y="225" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12">NL Parser</text>
  <text x="430" y="240" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="9">Natural language</text>

  <rect x="500" y="205" width="120" height="45" fill="#21262d" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="560" y="225" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12">Templates</text>
  <text x="560" y="240" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="9">Task blueprints</text>

  <!-- ====== Data Layer ====== -->
  <text x="425" y="310" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Data Layer</text>

  <!-- Sync files -->
  <rect x="30" y="325" width="130" height="85" fill="#21262d" stroke="#8957e5" stroke-width="2" rx="8"/>
  <text x="95" y="350" text-anchor="middle" fill="#d2a8ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Sync Files</text>
  <text x="95" y="370" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">TASKS.md</text>
  <text x="95" y="385" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">HEARTBEAT.md</text>
  <text x="95" y="400" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">AGENTS.md</text>

  <rect x="175" y="325" width="130" height="85" fill="#21262d" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="240" y="350" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">tasks/</text>
  <text x="240" y="370" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">JSON per task</text>
  <text x="240" y="385" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">+ subtasks</text>
  <text x="240" y="400" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">+ notes</text>

  <rect x="320" y="325" width="130" height="85" fill="#21262d" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="385" y="350" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">agents/</text>
  <text x="385" y="370" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Dispatched</text>
  <text x="385" y="385" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">sessions</text>

  <rect x="465" y="325" width="130" height="85" fill="#21262d" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="530" y="350" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">tools/</text>
  <text x="530" y="370" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Custom tools</text>
  <text x="530" y="385" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">(AI-created)</text>

  <rect x="610" y="325" width="130" height="85" fill="#21262d" stroke="#30363d" stroke-width="2" rx="8"/>
  <text x="675" y="350" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">logs/</text>
  <text x="675" y="370" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Activity logs</text>
  <text x="675" y="385" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">(JSONL)</text>

  <!-- Connection lines: core to data -->
  <line x1="300" y1="260" x2="300" y2="295" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="425" y1="280" x2="425" y2="295" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="560" y1="260" x2="560" y2="295" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Data partition lines -->
  <line x1="160" y1="365" x2="175" y2="365" stroke="#30363d" stroke-width="1.5"/>
  <line x1="305" y1="365" x2="320" y2="365" stroke="#30363d" stroke-width="1.5"/>
  <line x1="450" y1="365" x2="465" y2="365" stroke="#30363d" stroke-width="1.5"/>
  <line x1="595" y1="365" x2="610" y2="365" stroke="#30363d" stroke-width="1.5"/>
</svg>