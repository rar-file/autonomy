<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" fill="none">
  <rect width="800" height="280" fill="#0d1117" rx="10"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Task Sync Bridge — How the AI Sees Your Tasks</text>

  <!-- Source: tasks/ JSON -->
  <rect x="30" y="60" width="160" height="100" fill="#21262d" stroke="#f78166" stroke-width="2" rx="8"/>
  <text x="110" y="90" text-anchor="middle" fill="#f78166" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">tasks/*.json</text>
  <text x="110" y="112" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Individual JSON files</text>
  <text x="110" y="127" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">One per task</text>
  <text x="110" y="147" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="11">Source of truth</text>

  <!-- Arrow 1: to sync function -->
  <line x1="190" y1="110" x2="240" y2="110" stroke="#8b949e" stroke-width="2"/>
  <polygon points="235,105 245,110 235,115" fill="#8b949e"/>

  <!-- Sync Function -->
  <rect x="245" y="70" width="150" height="80" fill="#238636" rx="8"/>
  <text x="320" y="100" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">sync_all_tasks()</text>
  <text x="320" y="120" text-anchor="middle" fill="#aff5b4" font-family="system-ui, -apple-system, sans-serif" font-size="10">Called after every</text>
  <text x="320" y="133" text-anchor="middle" fill="#aff5b4" font-family="system-ui, -apple-system, sans-serif" font-size="10">task mutation</text>

  <!-- Arrow 2: to TASKS.md -->
  <line x1="395" y1="90" x2="460" y2="70" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="453,65 463,68 455,75" fill="#58a6ff"/>

  <!-- Arrow 3: to HEARTBEAT.md -->
  <line x1="395" y1="110" x2="460" y2="110" stroke="#8957e5" stroke-width="2"/>
  <polygon points="455,105 465,110 455,115" fill="#8957e5"/>

  <!-- Arrow 4: to AGENTS.md -->
  <line x1="395" y1="130" x2="460" y2="150" stroke="#f78166" stroke-width="2"/>
  <polygon points="453,145 463,152 455,155" fill="#f78166"/>

  <!-- Target 1: TASKS.md -->
  <rect x="465" y="40" width="155" height="55" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="542" y="62" text-anchor="middle" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">TASKS.md</text>
  <text x="542" y="80" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Read every conversation</text>

  <!-- Target 2: HEARTBEAT.md -->
  <rect x="465" y="100" width="155" height="55" fill="#161b22" stroke="#8957e5" stroke-width="2" rx="8"/>
  <text x="542" y="122" text-anchor="middle" fill="#8957e5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">HEARTBEAT.md</text>
  <text x="542" y="140" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Read every 30 min</text>

  <!-- Target 3: AGENTS.md -->
  <rect x="465" y="160" width="155" height="55" fill="#161b22" stroke="#f78166" stroke-width="2" rx="8"/>
  <text x="542" y="182" text-anchor="middle" fill="#f78166" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">AGENTS.md</text>
  <text x="542" y="200" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">Read on session start</text>

  <!-- Arrow to AI -->
  <line x1="620" y1="75" x2="670" y2="110" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="620" y1="127" x2="670" y2="117" stroke="#8957e5" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="620" y1="180" x2="670" y2="125" stroke="#f78166" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- AI Agent -->
  <rect x="670" y="80" width="110" height="70" fill="#1f6feb" rx="10"/>
  <text x="725" y="108" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="20">🤖</text>
  <text x="725" y="130" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">AI Agent</text>
  <text x="725" y="145" text-anchor="middle" fill="#a5d6ff" font-family="system-ui, -apple-system, sans-serif" font-size="9">Sees all tasks</text>

  <!-- Bottom note -->
  <rect x="100" y="230" width="600" height="35" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="400" y="252" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="12">Without sync, the AI NEVER sees your tasks. Sync is mandatory after every change.</text>
</svg>
