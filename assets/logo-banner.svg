<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clawGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b7a"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="120" fill="#0d1117" rx="10"/>
  
  <!-- Logo: stylised crab claw -->
  <g transform="translate(10, 6)" filter="url(#glow)">
    <!-- Left pincer — thick bold arm curving up and in, tip points right -->
    <path d="M30 82 C22 62, 14 42, 26 24 C30 18, 38 16, 40 22 C43 30, 36 42, 40 50"
          fill="none" stroke="url(#clawGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Left pincer tip — sharp hook inward -->
    <path d="M40 50 C42 44, 46 40, 44 34"
          fill="none" stroke="#ff6b7a" stroke-width="4" stroke-linecap="round"/>

    <!-- Right pincer — mirror, thick bold arm -->
    <path d="M58 82 C66 62, 74 42, 62 24 C58 18, 50 16, 48 22 C45 30, 52 42, 48 50"
          fill="none" stroke="url(#clawGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Right pincer tip — sharp hook inward -->
    <path d="M48 50 C46 44, 42 40, 44 34"
          fill="none" stroke="#ff6b7a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Text: ClawTonomy -->
  <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#e6edf3">Claw</text>
  <text x="205" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#e94560">Tonomy</text>
  
  <!-- Subtitle -->
  <text x="110" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e">Task Management &amp; AI Dispatch for OpenClaw</text>
  
  <!-- Version badge -->
  <rect x="110" y="88" width="52" height="20" fill="#238636" rx="4"/>
  <text x="136" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">v3.5</text>
  
  <!-- Extra badges -->
  <rect x="170" y="88" width="70" height="20" fill="#1f6feb" rx="4"/>
  <text x="205" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="white" text-anchor="middle">36 APIs</text>
  
  <rect x="248" y="88" width="76" height="20" fill="#8957e5" rx="4"/>
  <text x="286" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="white" text-anchor="middle">AI Dispatch</text>
  
  <rect x="332" y="88" width="64" height="20" fill="#f78166" rx="4"/>
  <text x="364" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="white" text-anchor="middle">OpenClaw</text>
</svg>