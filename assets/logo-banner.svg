<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3fb950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <filter id="bannerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bannerGrad)" rx="12"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="796" height="196" fill="none" stroke="#30363d" stroke-width="2" rx="10"/>
  
  <!-- Logo icon -->
  <g transform="translate(60, 100)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#58a6ff" stroke-width="3" filter="url(#bannerGlow)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="8 4" opacity="0.8"/>
    <circle cx="0" cy="0" r="15" fill="#58a6ff" opacity="0.4"/>
    <circle cx="0" cy="0" r="8" fill="url(#textGrad)"/>
    
    <!-- Orbital dots -->
    <circle cx="0" cy="-40" r="5" fill="#58a6ff"/>
    <circle cx="35" cy="20" r="4" fill="#3fb950"/>
    <circle cx="-35" cy="20" r="3" fill="#58a6ff" opacity="0.7"/>
  </g>
  
  <!-- Title -->
  <text x="150" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)" filter="url(#bannerGlow)">Autonomy</text>
  
  <!-- Subtitle -->
  <text x="150" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8b949e">AI-Driven Self-Improving System for OpenClaw</text>
  
  <!-- Version badge -->
  <rect x="680" y="85" width="80" height="30" fill="#21262d" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="720" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="600">v3.0</text>
  
  <!-- Decorative lines -->
  <line x1="150" y1="140" x2="400" y2="140" stroke="#30363d" stroke-width="1"/>
  <!-- Feature pills -->
  <rect x="150" y="155" width="100" height="24" fill="#238636" opacity="0.2" rx="12"/>
  <text x="200" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#3fb950" text-anchor="middle" font-weight="600">OpenClaw Native</text>
  
  <rect x="260" y="155" width="90" height="24" fill="#1f6feb" opacity="0.2" rx="12"/>
  <text x="305" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#58a6ff" text-anchor="middle" font-weight="600">Web Dashboard</text>
  
  <rect x="360" y="155" width="70" height="24" fill="#8957e5" opacity="0.2" rx="12"/>
  <text x="395" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#a371f7" text-anchor="middle" font-weight="600">GitHub</text>
</svg>